# Automend — single-stack deployment for Coolify.
#
# One resource deploys everything: Postgres, Redis (Dragonfly), the migration runner, the API, the
# worker and the web app. SigNoz is deliberately *not* here — it is its own Coolify resource with
# its own lifecycle, and this stack only needs its collector URL.
#
# This is NOT the repo-root docker-compose.yml. That one is local development only and publishes
# ports on the host; this one keeps everything on the stack's private network and exposes exactly
# one thing to the internet: the web app.
#
# Coolify treats this file as the source of truth — set values here, not in the UI.
#
# Deploy: New Resource → Docker Compose → this file, with the repo as the source.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-automend}
    volumes:
      # Postgres 18 moved PGDATA to /var/lib/postgresql/<major>/docker and declares the *parent*
      # as its volume. Mounting the old .../data path here would put the database outside the
      # volume — everything works until the container is recreated, then the data is gone.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Named `redis` because that is the interface the apps code against; the image is DragonflyDB.
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.1
    restart: unless-stopped
    command:
      # Not optional. BullMQ's Lua scripts access keys they do not declare, which Dragonfly refuses
      # by default — every health check stays green while job processing fails completely.
      # Queue names are brace-wrapped ({flow-executions}) to give it a hashtag to lock on; both
      # halves are required together.
      - "--cluster_mode=emulated"
      - "--lock_on_hashtags"
      - "--requirepass=${SERVICE_PASSWORD_REDIS}"
    ulimits:
      # Dragonfly locks its memory; without this the container fails to start on some hosts.
      memlock: -1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SERVICE_PASSWORD_REDIS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Applies the committed Drizzle migrations, then exits. The api and worker wait for it to
  # succeed, so the schema is always current before anything serves traffic.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["bun", "run", "/app/packages/db/src/migrate.ts"]
    restart: "no"
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-automend}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 3000
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-automend}
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0
      # The public address of the web app, and the only origin that makes a cross-origin call —
      # the browser reaches the API through the web app's own domain.
      #
      # Set by hand, to the same domain assigned to the `web` service below. Coolify consumes
      # SERVICE_FQDN_WEB_8080 while it builds the proxy route and never passes it back to a
      # container, so referencing it here resolves to an empty string, which the API rejects at
      # startup — a crash loop that a deploy only reports as "container api is unhealthy".
      WEB_ORIGIN: "${PUBLIC_WEB_URL:?set this to the web app's own address, e.g. https://automend.example.com}"
      # Signs session cookies and encrypts stored OAuth tokens. Coolify generates one on first
      # deploy and keeps it; rotating it signs every user out.
      AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      # OAuth providers redirect the *browser* back, so this is the public web address — never the
      # API's in-network one.
      AUTH_BASE_URL: "${PUBLIC_WEB_URL:?set this to the web app's own address, e.g. https://automend.example.com}"
      # Optional. Both must be set for "Continue with Google" to appear; the redirect URI to
      # register with Google is ${PUBLIC_WEB_URL}/api/v1/auth/callback/google.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Envelope-encrypts stored connector tokens. Set by hand rather than from a Coolify magic
      # variable: this must decode to exactly 32 bytes, and SERVICE_PASSWORD_64_* yields 48.
      # Generate with: openssl rand -base64 32
      # Rotating it makes every stored connector token unreadable, so treat it as permanent.
      # Quoted because the `:?` message would otherwise put a colon in an unquoted YAML scalar.
      SECRETS_KEY: "${SECRETS_KEY:?generate one with openssl rand -base64 32}"
      # Optional, and each pair is all-or-nothing. Connecting a service is a SEPARATE OAuth
      # registration from signing in with it: the redirect URI is
      # ${PUBLIC_WEB_URL}/api/v1/auth/oauth2/callback/<provider>-connector
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Optional, and both halves or nothing: with either unset the queue dashboard is not mounted.
      # Reachable at ${PUBLIC_WEB_URL}/ops/queues once set, because the web app proxies that prefix
      # onward the same way it proxies /api.
      #
      # This is an administrative credential, not a user one. The queue holds every workspace's job
      # payloads, and the dashboard can enqueue work the worker will run — so treat it like
      # SECRETS_KEY, and put Coolify's IP allowlist or its own Basic Auth in front of the domain if
      # the stack is on the open internet.
      OPS_DASHBOARD_USER: ${OPS_DASHBOARD_USER:-}
      OPS_DASHBOARD_PASSWORD: ${OPS_DASHBOARD_PASSWORD:-}
      # The studio's public address as the *browser* sees it, which is the domain Coolify generated for
      # the `studio` service below — read it off that service and paste it here. Left unset, the
      # Operations page reports the studio as unavailable rather than linking somewhere unreachable.
      STUDIO_URL: ${STUDIO_URL:-}
      OTEL_LOGS_ENABLED: ${OTEL_LOGS_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?set this to your SigNoz collector base URL}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_HEALTH_PORT: 3002
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-automend}
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0
      # The engine resolves each step's credentials itself, so the worker needs the same auth values as the api —
      # the same values, not copies. Given different ones it would refresh nothing and decrypt nothing.
      AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      SECRETS_KEY: "${SECRETS_KEY:?generate one with openssl rand -base64 32}"
      AUTH_BASE_URL: "${PUBLIC_WEB_URL:?set this to the web app's own address, e.g. https://automend.example.com}"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Off unless a deployment genuinely automates against a service on its own network. An HTTP step's URL can
      # come from a flow's data, so with this on whoever sends a webhook chooses where the worker connects.
      ENGINE_ALLOW_PRIVATE_NETWORK: ${ENGINE_ALLOW_PRIVATE_NETWORK:-false}
      OTEL_LOGS_ENABLED: ${OTEL_LOGS_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?set this to your SigNoz collector base URL}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The only service with a domain. It serves the bundle and proxies /api and /otlp onward from
  # inside this network, which is why the API and the collector need no public exposure and why
  # neither address ever reaches the browser.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Declares this stack's one public route: Coolify reads the key, generates a domain for the
      # `web` service and proxies it to port 8080. The value is the *path* to serve from, not a
      # URL, and the variable itself never reaches a container — everything that needs the public
      # address reads PUBLIC_WEB_URL instead.
      SERVICE_FQDN_WEB_8080: /
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_PORT: 8080
      API_URL: http://api:3000
      OTEL_LOGS_ENABLED: ${OTEL_LOGS_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?set this to your SigNoz collector base URL}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      api:
        condition: service_healthy

  # The database studio: Drizzle Gateway, which is Drizzle Studio packaged to be self-hosted.
  #
  # It exists because there is no terminal on this server. `drizzle-kit studio` serves its data to a
  # hosted front-end over a connection to 127.0.0.1, which is a laptop tool; this is the same UI as a
  # container, so reading and editing the database is something the stack itself provides.
  #
  # It is a full database console on a public domain, and MASTERPASS is the whole of what guards it.
  # Required rather than defaulted, and the reason is sharper than "no password": Gateway's login
  # handler is `if (!MASTERPASS) return success`, so an unset one still shows a password box and
  # accepts anything typed into it. That deploys a console that looks guarded and is not.
  # Put Coolify's IP allowlist in front of this service's domain unless the stack is private.
  #
  # It is given no DATABASE_URL: Gateway stores the connections you add in its own volume, so add
  # one through its UI with the same in-network address the api uses (postgres:5432).
  studio:
    image: ghcr.io/drizzle-team/gateway:1.4.1
    restart: unless-stopped
    environment:
      # Its own domain, not a path under the web app's: Gateway serves its assets from the root of
      # whatever origin it is on, so it cannot be proxied under a prefix the way /ops/queues is.
      SERVICE_FQDN_STUDIO_4983: /
      PORT: 4983
      # Must match the volume below. Without a mounted store, every restart of this container loses
      # the saved connection and asks for the database credentials again.
      STORE_PATH: /app
      MASTERPASS: "${STUDIO_PASSWORD:?generate one with openssl rand -base64 24}"
    volumes:
      - studio-data:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  studio-data:
