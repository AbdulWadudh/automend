<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logo.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    <!-- Browser chrome follows the system preference; one fixed value leaves it wrong in one theme. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Automend is a self-hosted workflow automation platform with AI steps. Build flows visually and run them on your own infrastructure — your data, your model keys."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Automend" />
    <meta property="og:title" content="Automend — self-hosted AI workflow automation" />
    <meta
      property="og:description"
      content="Build flows visually, drop an AI step anywhere in them, and run the whole thing on servers you control."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Automend — self-hosted AI workflow automation</title>
    <!--
      The stored theme, applied before first paint.

      Inline and before the bundle on purpose: a theme applied from React arrives a frame late, which is a
      visible flash of the wrong colours on every load. `class="dark"` above is the fallback for a browser
      that never runs this.

      The key and the class mirror `config.webClient.theme`; `tests/theme.test.ts` fails if they drift.
    -->
    <script>
      (() => {
        let stored = "system";

        try {
          stored = localStorage.getItem("automend.theme") || "system";
        } catch {
          /* Blocked storage keeps the default rather than failing to render. */
        }

        const dark = stored === "dark" || (stored === "system" && matchMedia("(prefers-color-scheme: dark)").matches);

        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
