# Local development only.
#
# Production is NOT this file: Coolify builds and deploys each app's Dockerfile independently.
#
# Every value here is substituted from `.env`, which is generated from
# `packages/shared/src/config.ts` by `bun run config:sync`. Nothing is written down twice —
# change a port in config.ts, run config:sync, and this file follows.
#
# Requires a `.env` at the repo root: `cp .env.example .env`.
#
# Telemetry: the apps export logs over OTLP to whatever OTEL_EXPORTER_OTLP_ENDPOINT names —
# normally the deployed SigNoz. Set OTEL_LOGS_ENABLED=false to run without one; logs still go to
# stdout either way.

name: automend

x-telemetry: &telemetry
  OTEL_LOGS_ENABLED: ${OTEL_LOGS_ENABLED}
  # No *_FROM_CONTAINER variant: the collector is a remote URL, reachable identically from the
  # host and from inside a container. Postgres and Redis do need the split — they are compose
  # services, so `localhost` means something different in each place.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    # Told to listen on the configured port, so host and container agree even if it changes.
    command: ["postgres", "-p", "${POSTGRES_PORT}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      # Postgres 18 moved PGDATA to /var/lib/postgresql/<major>/docker and declares the *parent*
      # as its volume. Mounting the old .../data path against an 18 image leaves the database
      # outside the volume — it works until the container is recreated, then the data is gone.
      #
      # Written literally, not as ${POSTGRES_DATA_PATH}: Coolify's compose parser rejects variable
      # substitution in a volume *target* as a path-injection risk. The value still lives in
      # config.ts (`localDev.postgres.dataPath`) and tests/compose.test.ts fails if the two drift.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Single `$` on purpose: Compose substitutes these from .env before Docker ever sees them,
      # so the values match the ones the server was started with.
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-p", "${POSTGRES_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Named `redis` because that is the interface every app codes against. The image behind it is
  # DragonflyDB, which is Redis-wire-compatible — swapping it for stock Redis needs no code change.
  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    # Dragonfly-specific. Hashtag locking lets BullMQ's Lua scripts lock one {queue} instead of
    # the whole store; without these flags Dragonfly serialises every BullMQ operation.
    command:
      - "--port=${REDIS_PORT}"
      - "--cluster_mode=emulated"
      - "--lock_on_hashtags"
    ulimits:
      # Dragonfly locks its memory; without this the container fails to start on some hosts.
      memlock: -1
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs the committed Drizzle migrations, then exits. The api and worker wait for it to succeed,
  # so `docker compose up` always starts against an up-to-date schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["bun", "run", "/app/packages/db/src/migrate.ts"]
    restart: "no"
    environment:
      <<: *telemetry
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL_FROM_CONTAINER}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *telemetry
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL_FROM_CONTAINER}
      REDIS_URL: ${REDIS_URL_FROM_CONTAINER}
      API_PORT: ${API_PORT}
      WEB_ORIGIN: ${WEB_ORIGIN}
      AUTH_SECRET: ${AUTH_SECRET}
      # The browser's address, not the API's: OAuth providers redirect back to where the user is.
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SECRETS_KEY: ${SECRETS_KEY}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      # Switches the queue dashboard on, reached from /app/operations. Both halves or it stays off —
      # see apps/api/src/routes/queue-dashboard.ts for what the credential admits.
      OPS_DASHBOARD_USER: ${OPS_DASHBOARD_USER}
      OPS_DASHBOARD_PASSWORD: ${OPS_DASHBOARD_PASSWORD}
      # The studio's address as the *browser* sees it, so the Operations page can link to it. Not an
      # in-network address: the browser is what follows this, not the api.
      STUDIO_URL: ${STUDIO_URL}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *telemetry
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL_FROM_CONTAINER}
      REDIS_URL: ${REDIS_URL_FROM_CONTAINER}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      # The engine resolves a connection's credentials itself, so the worker needs the same auth values as the
      # api — not copies. Configured differently it would refresh nothing and decrypt nothing.
      AUTH_SECRET: ${AUTH_SECRET}
      SECRETS_KEY: ${SECRETS_KEY}
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ENGINE_ALLOW_PRIVATE_NETWORK: ${ENGINE_ALLOW_PRIVATE_NETWORK}
    ports:
      - "${WORKER_HEALTH_PORT}:${WORKER_HEALTH_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      <<: *telemetry
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      WEB_PORT: ${WEB_PORT}
      # In-network proxy target. The browser never sees this address.
      API_URL: http://api:${API_PORT}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    depends_on:
      api:
        condition: service_healthy

  # Drizzle Gateway: Drizzle Studio, self-hosted. Named for what it is rather than what runs it,
  # the same way `redis` is really Dragonfly.
  #
  # Not started by `bun run dev:up`, which brings up only the stores the apps need — run
  # `docker compose up studio` when you want it. It knows nothing about this stack until you add a
  # connection through its UI: paste DATABASE_URL_FROM_CONTAINER, since from in here `localhost` is
  # this container.
  studio:
    image: ${STUDIO_IMAGE}
    restart: unless-stopped
    environment:
      PORT: ${STUDIO_PORT}
      # Where Gateway keeps the connections you add and the session you signed in with. Must match
      # the volume below, or every restart asks for the database credentials again.
      STORE_PATH: /app
      # Never leave this empty. Gateway's login handler is `if (!MASTERPASS) return success` — with no
      # master password it still renders a password box and accepts *anything typed into it*, so the
      # studio reads as protected while being wide open. `.env.example` ships a local throwaway value
      # for that reason, and the Coolify stack refuses to deploy without a real one.
      MASTERPASS: ${STUDIO_PASSWORD:?do not leave this blank — Gateway would accept any password}
    ports:
      - "${STUDIO_PORT}:${STUDIO_PORT}"
    volumes:
      # Written literally rather than as ${STUDIO_STORE_PATH}: Coolify's compose parser rejects
      # variable substitution in a volume *target*. tests/compose.test.ts fails if it drifts from
      # config.ops.databaseStudio.storePath.
      - studio-data:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  studio-data:
